phases.forEach((p,i)=>{const b=makeButton('',()=>{current=highlights.findIndex(id=>byId.get(id).phase===p.name);elapsed=0;show()});b.className='stage';b.setAttribute('aria-label',p.name+'，'+p.count+'条记录');b.innerHTML='<small>'+p.range+'</small><div class="phase"><strong>'+p.name+'</strong><b>'+p.count+'</b><em>条记录</em></div><p>'+p.label+'</p>';$('#stages').append(b)});

function blocked(){return paused||$('#detail').open||$('#archive').open||document.hidden}function sync(){text('#pause',paused?'继续流动':'暂停流动');text('#state',$('#detail').open||$('#archive').open?'阅读中 · 已暂停':paused?'已暂停 · 可手动切换':'自动展播 · 点击记录暂停阅读')}
function openRecord(r){lastFocus=document.activeElement;text('#detail-meta',r.date+' / '+r.phase+' / '+r.status);text('#detail-title',r.title);text('#detail-why',r.why);text('#detail-what',r.what);text('#detail-result',r.result);text('#detail-source','记录编号 '+r.id+' · 原表第'+r.row+'行\n核验线索：'+r.source);$('#detail').showModal();sync()}
$('#read').onclick=()=>openRecord(byId.get(highlights[current]));$('#prev').onclick=()=>{current=(current-1+highlights.length)%highlights.length;elapsed=0;show()};$('#next').onclick=()=>{current=(current+1)%highlights.length;elapsed=0;show()};$('#pause').onclick=()=>{paused=!paused;sync()};$('#close-detail').onclick=()=>$('#detail').close();$('#detail').addEventListener('close',()=>{sync();lastFocus?.focus({preventScroll:true})});$('#close-archive').onclick=()=>$('#archive').close();$('#archive').addEventListener('close',sync);
for(const r of records){const b=makeButton('',()=>openRecord(r));b.className='record';const t=document.createElement('time');t.textContent=r.date.slice(5).replace('-','.');const n=document.createElement('span');n.textContent=r.title;b.append(t,n);$('#track').append(b)}
function renderList(){const q=$('#search').value.trim().toLowerCase(),items=records.filter(r=>(!filter||r.phase===filter)&&(!q||[r.title,r.why,r.what,r.status].join(' ').toLowerCase().includes(q)));$('#list').replaceChildren();text('#list-count','共 '+items.length+' 条记录');for(const r of items){const b=makeButton('',()=>openRecord(r));const t=document.createElement('time');t.textContent=r.date.slice(5);const n=document.createElement('span');n.textContent=r.title;const st=document.createElement('small');st.textContent=r.status;b.append(t,n,st);$('#list').append(b)}if(!items.length){const p=document.createElement('p');p.className='no-result';p.textContent='没有匹配记录，请换一个关键词。';$('#list').append(p)}document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.textContent===filter));$('#clear-filter').classList.toggle('active',!filter)}
phases.forEach(p=>$('#filters').append(makeButton(p.name,()=>{filter=p.name;renderList()})));$('#clear-filter').onclick=()=>{filter='';renderList()};$('#search').oninput=renderList;$('#all').onclick=()=>{renderList();$('#archive').showModal();sync()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{text('#fullscreen','请使用浏览器全屏')}};
document.addEventListener('keydown',e=>{if($('#detail').open||$('#archive').open||/INPUT|BUTTON|A/.test(e.target.tagName))return;if(e.key===' '){e.preventDefault();$('#pause').click()}if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!blocked()){elapsed+=dt;offset+=dt*26;const track=$('#track'),first=track.firstElementChild;if(first&&offset>first.getBoundingClientRect().width+14){offset-=first.getBoundingClientRect().width+14;track.append(first)}track.style.transform='translateX(-'+offset+'px)';if(elapsed>=8){current=(current+1)%highlights.length;elapsed=0;show()}}requestAnimationFrame(frame)}show();sync();requestAnimationFrame(frame);
</script></body></html>
