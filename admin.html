<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>馆员审核台｜舆上·成都</title>
  <meta name="description" content="“舆上蜀”系列之“舆上·成都”公众城市记忆馆员审核台：查看自动登记结果并进行馆员人工审核。">
  <link rel="stylesheet" href="./admin.css?v=20260911-memory01">
  <script
    src="https://static.cloudbase.net/cloudbase-js-sdk/2.27.1/cloudbase.full.js"
    onload="console.log('CloudBase SDK 2.27.1 加载成功')"
    onerror="console.error('CloudBase SDK 2.27.1 加载失败')"
  ></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header__inner">
      <div>
        <p class="eyebrow">LIBRARIAN REVIEW CONSOLE</p>
        <h1>馆员审核台</h1>
        <p class="subtitle">无模型自动登记 · 馆员审核 · 城市记忆公开</p>
      </div>
      <div class="header-actions">
        <a class="btn ghost" href="./index.html" target="_blank" rel="noopener">查看公众端</a>
        <button class="btn primary" id="refreshButton" type="button">刷新投稿记录</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="status-panel">
      <div>
        <span class="status-dot" id="connectionDot"></span>
        <strong id="connectionText">正在连接 CloudBase…</strong>
      </div>
      <p id="authMessage">正在验证馆员身份。</p>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <section class="submission-overview" aria-labelledby="overviewTitle">
        <div class="overview-heading">
          <div><p class="section-label">Submission Overview</p><h2 id="overviewTitle">投稿总览</h2></div>
          <p id="statsUpdated" role="status">正在读取累计数据…</p>
        </div>
        <div class="stats-grid">
          <article class="stat-card stat-total"><span>累计投稿</span><strong id="statTotal">—</strong><small>迄今为止全部已保存投稿</small></article>
          <article class="stat-card stat-pass"><span>已公开</span><strong id="statPublished">—</strong><small>馆员批准且公开授权完整</small></article>
          <article class="stat-card stat-review"><span>未公开</span><strong id="statNotPublished">—</strong><small>包含待审核、不予公开等状态</small></article>
        </div>
        <p class="status-breakdown">未公开中：<span>待审核 <b id="statAwaiting">—</b></span><span>不予公开 <b id="statRejected">—</b></span><span>其他状态 <b id="statOther">—</b></span></p>
      </section>

      <section class="notification-panel" aria-labelledby="notificationTitle">
        <div>
          <h2 id="notificationTitle">新投稿提醒</h2>
          <p id="notificationStatus">页面打开时约每30秒检查新投稿；电脑系统通知需手动开启。</p>
          <p class="notification-help">关闭网页或设备休眠后，浏览器提醒会暂停。</p>
        </div>
        <button class="btn ghost" id="notificationButton" type="button">开启电脑通知</button>
      </section>
      <div class="new-submissions" id="newSubmissions" role="status" hidden>
        <span id="newSubmissionsText"></span>
        <button class="btn primary" id="viewNewButton" type="button">刷新查看</button>
      </div>

      <nav class="record-filters" aria-label="投稿记录分类">
        <button class="btn primary" type="button" data-scope="all" aria-pressed="true">全部投稿</button>
        <button class="btn ghost" type="button" data-scope="awaiting" aria-pressed="false">待审核</button>
        <button class="btn ghost" type="button" data-scope="published" aria-pressed="false">已公开</button>
        <button class="btn ghost" type="button" data-scope="rejected" aria-pressed="false">不予公开</button>
      </nav>
      <p class="review-outcome" id="reviewOutcome" role="status" hidden></p>
      <div class="toolbar">
        <div>
          <p class="section-label">Submission Records</p>
          <h2>投稿记录</h2>
          <p id="queueCount" class="queue-count"></p>
        </div>
        <label class="filter-control">
          <span>筛选初筛状态</span>
          <select id="suggestionFilter">
            <option value="all">全部</option>
            <option value="pass">PASS · 建议通过</option>
            <option value="review">REVIEW · 重点复核</option>
            <option value="reject">REJECT · 建议拒绝</option>
          </select>
        </label>
      </div>

      <div class="queue-message" id="queueMessage" hidden></div>
      <div class="review-list" id="reviewList"></div>
      <button class="btn ghost load-more" id="loadMoreButton" type="button" hidden>加载更多投稿记录</button>
    </section>
  </main>

  <template id="reviewCardTemplate">
    <article class="review-card">
      <div class="review-card__top">
        <div>
          <p class="review-point"></p>
          <h3 class="review-time"></h3>
        </div>
        <div class="review-badges"></div>
      </div>

      <div class="review-grid">
        <section class="panel user-panel">
          <p class="panel-label">公众投稿</p>
          <div class="submission-text"></div>
          <div class="submission-images"></div>
          <dl class="submission-meta"></dl>
        </section>

        <section class="panel ai-panel">
          <p class="panel-label">自动初筛 · 无模型</p>
          <div class="ai-score"></div>

          <div class="ai-field">
            <strong>摘要</strong>
            <p class="ai-summary"></p>
          </div>

          <div class="ai-field">
            <strong>初审理由</strong>
            <p class="ai-reason"></p>
          </div>

          <div class="ai-field">
            <strong>标签</strong>
            <div class="ai-tags"></div>
          </div>

          <div class="ai-field">
            <strong>风险提示</strong>
            <div class="risk-grid"></div>
          </div>
        </section>
      </div>

      <section class="human-review">
        <p class="panel-label">馆员终审</p>
        <dl class="review-record" hidden></dl>
        <p class="human-review__help">
          当前未启用模型服务。公开、继续核验或不予公开均由馆员根据原始材料决定。
        </p>

        <label class="review-note">
          <span>审核备注（可选）</span>
          <textarea
            rows="2"
            maxlength="500"
            placeholder="例如：图片与点位一致，授权字段完整；或需要进一步核验照片时间。"
          ></textarea>
        </label>

        <div class="review-actions">
          <button type="button" class="action-btn approve" data-decision="approved">批准公开</button>
          <button type="button" class="action-btn hold" data-decision="needs_review">继续核验</button>
          <button type="button" class="action-btn reject" data-decision="rejected">不予公开</button>
        </div>

        <p class="card-status" aria-live="polite"></p>
      </section>
    </article>
  </template>

  <script src="./admin.js?v=20260909-history01"></script>
</body>
</html>
